<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover：讓 iPhone 瀏海/底部橫條區域也能正確留白 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <!-- 內容安全政策（CSP）：只允許載入自己的腳本與 Google 登入腳本，即使有人注入腳本也無法執行或把資料送到別的網站 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style; img-src 'self' data: blob:; connect-src 'self' https://www.googleapis.com https://sheets.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="theme-color" content="#2f6fed">
  <title>TossDrive</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232f6fed' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4'/><polyline points='17 8 12 3 7 8'/><line x1='12' y1='3' x2='12' y2='15'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===================== 登入畫面 ===================== -->
  <section id="login-view" class="login" hidden>
    <div class="login-card">
      <div class="login-logo" data-icon="upload"></div>
      <h1>TossDrive</h1>
      <p class="tagline">Toss it here, find it there.</p>
      <p class="login-desc">
        用你的 Google 帳號登入。<br>
        訊息和檔案會存在你自己 Google Drive 的<br>
        「<b>TossDrive</b>」資料夾，不經過任何其他伺服器。
      </p>
      <button id="login-btn" class="btn-primary" disabled>正在載入 Google 登入…</button>
      <p id="login-error" class="login-error" hidden></p>
      <p class="login-links"><a href="privacy.html">隱私權政策</a> · <a href="terms.html">服務條款</a></p>
      <p class="app-version login-version" hidden></p>
    </div>
  </section>

  <!-- ===================== 聊天室畫面 ===================== -->
  <section id="chat-view" class="chat" hidden>

    <!-- 上方標題列 -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-name">TossDrive</span>
        <span class="app-version" hidden></span>
        <span class="brand-tag">Toss it here, find it there.</span>
      </div>
      <div class="topbar-right">
        <span id="sync-dot" class="sync-dot" title="同步狀態"></span>
        <span id="account-email" class="account-email"></span>
        <button id="device-btn" class="icon-btn" title="切換這台裝置的標示（手機 / 電腦）" aria-label="切換裝置標示"></button>
        <a id="drive-link" class="icon-btn" target="_blank" rel="noopener" title="在 Google Drive 開啟 TossDrive 資料夾" aria-label="開啟 Drive 資料夾" data-icon="folder"></a>
        <button id="logout-btn" class="icon-btn" title="登出這台裝置" aria-label="登出" data-icon="power"></button>
      </div>
    </header>

    <!-- 登入過期提示（Google 的登入憑證約 1 小時過期） -->
    <div id="auth-banner" class="banner" hidden>
      <span>登入已過期，暫停同步</span>
      <button id="reauth-btn" class="btn-small">點此重新連線</button>
    </div>

    <!-- 時間軸（訊息列表） -->
    <main id="timeline" class="timeline">
      <button id="load-older" class="load-older" hidden>載入更早的訊息</button>
      <div id="messages" class="messages"></div>
      <div id="loading-hint" class="hint">連線到 Google Drive 中…</div>
      <div id="empty-hint" class="hint" hidden>
        還沒有任何訊息。<br>打字、選檔案、拍照，或直接把檔案拖進來試試看！
      </div>
    </main>

    <!-- 下方輸入列 -->
    <footer class="composer">
      <button id="attach-btn" class="icon-btn composer-btn" title="選擇檔案" aria-label="選擇檔案" data-icon="paperclip"></button>
      <button id="camera-btn" class="icon-btn composer-btn" title="拍照" aria-label="拍照" data-icon="camera"></button>
      <textarea id="text-input" rows="1" placeholder="輸入訊息…" autocomplete="off"></textarea>
      <button id="send-btn" class="btn-primary send-btn" title="送出" aria-label="送出" data-icon="send"></button>
      <!-- 隱藏的檔案選擇器 -->
      <input type="file" id="file-input" multiple hidden>
      <input type="file" id="camera-input" accept="image/*" capture="environment" hidden>
    </footer>

    <!-- 拖曳檔案時的提示遮罩（電腦） -->
    <div id="drop-overlay" class="drop-overlay" hidden>
      <div class="drop-box"><span data-icon="download"></span>放開即可上傳到 TossDrive</div>
    </div>
  </section>

  <!-- ===================== 看大圖 ===================== -->
  <div id="lightbox" class="lightbox" hidden>
    <img id="lightbox-img" alt="">
    <div class="lightbox-bar">
      <span id="lightbox-name" class="lightbox-name"></span>
      <button id="lightbox-download" class="btn-small" data-icon="download">下載</button>
      <button id="lightbox-close" class="btn-small" data-icon="x">關閉</button>
    </div>
  </div>

  <!-- 小提示訊息 -->
  <div id="toast" class="toast" hidden></div>

  <!-- 設定檔（一般腳本）要在主程式之前載入；主程式是 ES module，會自己載入 Google 登入元件 -->
  <script src="config.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
